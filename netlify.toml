[build]
  command = "vite build"
  publish = "dist"

# /api/dflow/* is handled by the edge function in netlify/edge-functions/dflow.js,
# which injects DFLOW_API_KEY from server env and restricts methods. Do NOT add a
# redirect forwarding /api/dflow straight to DFlow — that is an open relay with no
# key and no method allowlist.
[[edge_functions]]
  path = "/api/dflow/*"
  function = "dflow"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
